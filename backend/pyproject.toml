[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-atlas"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "celery[redis]>=5.5,<6", "redis>=5,<7", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "jieba>=0.42.1,<1", "pillow>=11,<13", "tzdata>=2025.1", "fastembed==0.9.0"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]
local = ["faster-whisper==1.2.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
