name: creator-atlas
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-creator_knowledge}:${POSTGRES_PASSWORD:?Run scripts/init.ps1 first}@postgres:5432/${POSTGRES_DB:-creator_knowledge}
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
    BACKUP_DIR: /backup
    TASK_MODE: celery
  volumes:
    - ${HOST_DATA_DIR:-./data}:/data
    - ${HOST_BACKUP_DIR:-./backups}:/backup
  restart: unless-stopped
  init: true
  stop_grace_period: 2m

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-creator_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-creator_knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init.ps1 first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker-capture:
    <<: *backend
    command: celery -A app.worker.celery_app worker -Q capture --concurrency=2 --loglevel=WARNING --hostname=capture@%h
    depends_on:
      api: { condition: service_healthy }
  worker-analysis:
    <<: *backend
    command: celery -A app.worker.celery_app worker -Q analysis --concurrency=2 --loglevel=WARNING --hostname=analysis@%h
    depends_on:
      api: { condition: service_healthy }
  beat:
    <<: *backend
    command: celery -A app.worker.celery_app beat --loglevel=WARNING --schedule=/data/celerybeat-schedule
    depends_on:
      api: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - ${WEB_BIND_ADDRESS:-127.0.0.1}:8000:80
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
